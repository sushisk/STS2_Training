name: paired-v07-trusted

on:
  workflow_dispatch:
    inputs:
      training_ref:
        description: Training branch, tag, or commit to test
        required: true
        default: agent/emulate-actions-batch

permissions:
  contents: read
  pull-requests: read

env:
  PAIRED_RL_SHA: ed927f9a6ea86d30910fedd1edcbb719715c97e2

jobs:
  paired-rl-v07:
    name: paired RL v0.7 integration (trusted manual run)
    # This workflow is intentionally manual-only. Configure the repository/runner so
    # this workflow is the only workflow allowed to target the persistent paired runner.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    steps:
      - name: Verify RL PR #8 current head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $pr = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/sushisk/STS2_RL/pulls/8'
          $currentRlSha = $pr.head.sha
          Write-Host "Pinned RL SHA:  $env:PAIRED_RL_SHA"
          Write-Host "Current RL SHA: $currentRlSha"
          if ($currentRlSha -ne $env:PAIRED_RL_SHA) {
            throw "PAIRED_RL_SHA is stale; expected current RL PR #8 head $currentRlSha"
          }

      - name: Checkout selected Training ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.training_ref }}
          path: training

      - name: Checkout paired RL commit
        uses: actions/checkout@v4
        with:
          repository: sushisk/STS2_RL
          ref: ${{ env.PAIRED_RL_SHA }}
          path: rl

      - name: Record paired commit identity
        shell: pwsh
        run: |
          $trainingSha = git -C training rev-parse HEAD
          $rlSha = git -C rl rev-parse HEAD
          if ($rlSha -ne $env:PAIRED_RL_SHA) {
            throw "paired RL checkout mismatch: expected $env:PAIRED_RL_SHA, got $rlSha"
          }
          "Training ref: ${{ inputs.training_ref }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Training SHA: $trainingSha" | Add-Content $env:GITHUB_STEP_SUMMARY
          "RL SHA: $rlSha" | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "Training SHA: $trainingSha"
          Write-Host "RL SHA: $rlSha"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify real Emulator runtime
        shell: pwsh
        run: |
          $dll = 'C:\STS2_Emulator\Sts2Emulator.Cli\bin\Debug\net8.0\Sts2Emulator.dll'
          $runtime = 'C:\STS2_Emulator\Sts2Emulator.Cli\bin\Debug\net8.0\Sts2Emulator.Cli.runtimeconfig.json'
          if (!(Test-Path $dll) -or !(Test-Path $runtime)) {
            throw 'paired-v07 requires a self-hosted Windows runner with the real STS2 Emulator built at C:\STS2_Emulator'
          }

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\training[test]" pythonnet

      - name: Run paired v0.7 integration
        working-directory: training
        env:
          STS2_RL_ROOT: ${{ github.workspace }}\rl
        run: python -m pytest tests/integration/test_paired_rl_v07.py -q
