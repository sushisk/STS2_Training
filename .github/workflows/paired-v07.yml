name: paired-v07

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PAIRED_RL_SHA: ed927f9a6ea86d30910fedd1edcbb719715c97e2

jobs:
  paired-head-gate:
    name: paired RL head matches pinned SHA
    runs-on: ubuntu-latest
    steps:
      - name: Verify RL PR #8 current head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_rl_sha="$({
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/sushisk/STS2_RL/pulls/8
          } | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"

          echo "Pinned RL SHA:  ${PAIRED_RL_SHA}"
          echo "Current RL SHA: ${current_rl_sha}"
          if [[ "${current_rl_sha}" != "${PAIRED_RL_SHA}" ]]; then
            echo "::error::PAIRED_RL_SHA is stale; update it to RL PR #8 current head before merging."
            exit 1
          fi

          {
            echo "### Paired v0.7 head gate"
            echo "- Pinned RL SHA: \`${PAIRED_RL_SHA}\`"
            echo "- Current RL PR #8 SHA: \`${current_rl_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  paired-rl-v07:
    name: paired RL v0.7 integration (trusted manual run)
    # Never execute PR code automatically on the persistent self-hosted runner.
    # A maintainer must explicitly dispatch this workflow for the Training ref to test.
    if: github.event_name == 'workflow_dispatch'
    needs: paired-head-gate
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    steps:
      - name: Checkout selected Training ref
        uses: actions/checkout@v4
        with:
          path: training

      - name: Checkout paired RL commit
        uses: actions/checkout@v4
        with:
          repository: sushisk/STS2_RL
          ref: ${{ env.PAIRED_RL_SHA }}
          path: rl

      - name: Record paired commit identity
        shell: pwsh
        run: |
          $trainingSha = git -C training rev-parse HEAD
          $rlSha = git -C rl rev-parse HEAD
          if ($rlSha -ne $env:PAIRED_RL_SHA) {
            throw "paired RL checkout mismatch: expected $env:PAIRED_RL_SHA, got $rlSha"
          }
          "Training SHA: $trainingSha" | Add-Content $env:GITHUB_STEP_SUMMARY
          "RL SHA: $rlSha" | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "Training SHA: $trainingSha"
          Write-Host "RL SHA: $rlSha"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify real Emulator runtime
        shell: pwsh
        run: |
          $dll = 'C:\STS2_Emulator\Sts2Emulator.Cli\bin\Debug\net8.0\Sts2Emulator.dll'
          $runtime = 'C:\STS2_Emulator\Sts2Emulator.Cli\bin\Debug\net8.0\Sts2Emulator.Cli.runtimeconfig.json'
          if (!(Test-Path $dll) -or !(Test-Path $runtime)) {
            throw 'paired-v07 requires a self-hosted Windows runner with the real STS2 Emulator built at C:\STS2_Emulator'
          }

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\training[test]" pythonnet

      - name: Run paired v0.7 integration
        working-directory: training
        env:
          STS2_RL_ROOT: ${{ github.workspace }}\rl
        run: python -m pytest tests/integration/test_paired_rl_v07.py -q
