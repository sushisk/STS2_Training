name: paired-v07-exact-pair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: read

env:
  PAIR_STATUS_CONTEXT: paired-v07-trusted-exact-pair

jobs:
  paired-head-gate:
    name: exact Training/RL pair passed trusted integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify external real-environment attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRAINING_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::v0.7 exact-pair attestation is restricted to same-repository PR heads."
            exit 1
          fi

          current_training_sha="$({
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/sushisk/STS2_Training/pulls/19
          } | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"

          current_rl_sha="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sushisk/STS2_RL/pulls/8 \
            | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"

          echo "Workflow Training SHA: ${TRAINING_SHA}"
          echo "Current Training SHA:  ${current_training_sha}"
          echo "Current RL SHA:        ${current_rl_sha}"

          if [[ "${TRAINING_SHA}" != "${current_training_sha}" ]]; then
            echo "::error::This workflow run is stale because Training PR #19 moved."
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TRAINING_SHA}/statuses?per_page=100" \
            > statuses.json

          python - "${PAIR_STATUS_CONTEXT}" "${current_rl_sha}" <<'PY'
          import json
          import sys

          context = sys.argv[1]
          rl_sha = sys.argv[2]
          expected_description = f"Passed with RL {rl_sha[:12]}"
          with open("statuses.json", "r", encoding="utf-8") as f:
              statuses = json.load(f)
          matching = [s for s in statuses if s.get("context") == context]
          if not matching:
              raise SystemExit(
                  "missing real-environment exact-pair attestation; "
                  "run scripts/attest_paired_v07.ps1 on the trusted Emulator machine"
              )
          latest = matching[0]
          if latest.get("state") != "success":
              raise SystemExit(f"real-environment attestation is {latest.get('state')!r}, not success")
          if latest.get("description") != expected_description:
              raise SystemExit(
                  "real-environment attestation belongs to a different RL head: "
                  f"{latest.get('description')!r} != {expected_description!r}"
              )
          print("Exact Training/RL pair is attested by the trusted real environment.")
          PY
