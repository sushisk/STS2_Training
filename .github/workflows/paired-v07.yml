name: training-hosted-contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  training-hosted-contract:
    # This required job is intentionally repo-local. It is not evidence that a
    # particular Training/RL/Emulator commit set passed cross-repository integration.
    name: training-hosted-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Training
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run hosted unit and contract regression tests
        run: python -m pytest -q -m "not integration"

      - name: Explain paired validation boundary
        if: always()
        run: |
          echo "This required check proves only Training repo-local hosted unit/contract regressions."
          echo "It does not attest an exact Training/RL/Emulator commit set."
          echo "Before merge, complete the PR's explicit exact-pair checklist against the pinned counterpart heads."
