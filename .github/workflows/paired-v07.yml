name: paired-v07-exact-pair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  paired-head-gate:
    name: exact Training/RL pair passed trusted integration
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ATTESTATION_CONTEXT: paired-v07-exact-pair
      TRUSTED_ATTESTATION_ISSUER: sushisk
      TRUSTED_ATTESTATION_ISSUER_ID: '136587185'
    steps:
      - name: Verify trusted exact-pair attestation
        shell: bash
        run: |
          set -euo pipefail

          training_repo='sushisk/STS2_Training'
          rl_repo='sushisk/STS2_RL'
          training_sha="$(gh api "repos/${training_repo}/pulls/19" --jq '.head.sha')"
          rl_sha="$(gh api "repos/${rl_repo}/pulls/8" --jq '.head.sha')"
          pair_description="Training=${training_sha} RL=${rl_sha}"

          event_head="$(python - <<'PY'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as handle:
              event = json.load(handle)
          print(event.get('pull_request', {}).get('head', {}).get('sha', ''))
          PY
          )"
          if [[ -n "${event_head}" && "${event_head}" != "${training_sha}" ]]; then
            echo "Training PR head moved while this gate was queued: event=${event_head} current=${training_sha}" >&2
            exit 1
          fi

          verify_status() {
            local repo="$1" sha="$2" payload
            payload="$(mktemp)"
            gh api "repos/${repo}/commits/${sha}/statuses?per_page=100" >"${payload}"
            python - "${payload}" "${ATTESTATION_CONTEXT}" "${pair_description}" "${TRUSTED_ATTESTATION_ISSUER}" "${TRUSTED_ATTESTATION_ISSUER_ID}" <<'PY'
          import json, sys
          path, context, description, issuer_login, issuer_id = sys.argv[1:]
          with open(path, encoding='utf-8') as handle:
              statuses = json.load(handle)
          matching = [item for item in statuses if item.get('context') == context]
          if not matching:
              raise SystemExit(f"missing status context {context!r}")
          latest = matching[0]
          creator = latest.get('creator') or {}
          creator_login = creator.get('login')
          creator_id = str(creator.get('id', ''))
          if creator_login != issuer_login or creator_id != issuer_id:
              raise SystemExit(
                  f"latest {context!r} status has untrusted issuer: "
                  f"login={creator_login!r} id={creator_id!r}"
              )
          if latest.get('state') != 'success' or latest.get('description') != description:
              raise SystemExit(
                  f"latest {context!r} status does not attest current pair {description!r}: "
                  f"state={latest.get('state')!r} description={latest.get('description')!r}"
              )
          PY
            rm -f "${payload}"
          }

          verify_status "${training_repo}" "${training_sha}"
          verify_status "${rl_repo}" "${rl_sha}"
          echo "Verified trusted attestation for ${pair_description}"