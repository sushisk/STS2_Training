name: paired-v07-head-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  PAIRED_RL_SHA: ed927f9a6ea86d30910fedd1edcbb719715c97e2

jobs:
  paired-head-gate:
    name: paired RL head matches pinned SHA
    # This PR-triggered workflow never checks out or executes PR code and never targets
    # a self-hosted runner. The emulator-backed integration lives in the separate,
    # workflow_dispatch-only paired-v07-trusted.yml workflow.
    runs-on: ubuntu-latest
    steps:
      - name: Verify RL PR #8 current head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_rl_sha="$({
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/sushisk/STS2_RL/pulls/8
          } | python -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"

          echo "Pinned RL SHA:  ${PAIRED_RL_SHA}"
          echo "Current RL SHA: ${current_rl_sha}"
          if [[ "${current_rl_sha}" != "${PAIRED_RL_SHA}" ]]; then
            echo "::error::PAIRED_RL_SHA is stale; update it to RL PR #8 current head before merging."
            exit 1
          fi

          {
            echo "### Paired v0.7 head gate"
            echo "- Pinned RL SHA: \`${PAIRED_RL_SHA}\`"
            echo "- Current RL PR #8 SHA: \`${current_rl_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
