name: paired-v07-exact-pair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  paired-head-gate:
    # Keep the existing job/check name so any branch-protection rule that already
    # requires this context continues to work. The implementation is now fully
    # GitHub-hosted and does not wait for an externally-published commit status.
    name: exact Training/RL pair passed trusted integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Training
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run hosted unit and contract regression tests
        run: python -m pytest -q -m "not integration"

      - name: Explain real-Emulator coverage
        if: always()
        run: |
          echo "The merge-blocking check is intentionally self-contained on GitHub-hosted runners."
          echo "tests marked 'integration' require STS2_RL_ROOT plus the real Emulator runtime and remain optional/manual validation."
