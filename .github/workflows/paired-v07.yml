name: paired-v07-exact-pair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  paired-head-gate:
    name: exact Training/RL pair passed trusted integration
    # The paired v0.7 integration requires the real STS2 Emulator/runtime.
    # Do not turn absence of that environment into a red GitHub PR check: it
    # makes infrastructure state indistinguishable from a product-code bug.
    # Run scripts/attest_paired_v07.ps1 explicitly on the trusted Emulator
    # machine when real-environment validation is required.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Real Emulator integration is external-only
        run: echo "Environment-dependent paired v0.7 integration is intentionally skipped in GitHub Actions."
