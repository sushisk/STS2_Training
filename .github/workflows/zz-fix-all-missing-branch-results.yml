name: apply-all-missing-branch-result-fix

on:
  push:
    branches: [track-beam-search-branch-faults]
    paths: [.github/workflows/zz-fix-all-missing-branch-results.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track-beam-search-branch-faults
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch implementation and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sts2_training/decision/beam_search.py')
          text = path.read_text()
          old = '''                if (\n                    branch_results\n                    and not next_beam\n                    and not newly_finished\n                    and not hit_continuation_limit\n                ):'''
          new = '''                if (\n                    emulated_item_meta\n                    and not next_beam\n                    and not newly_finished\n                    and not hit_continuation_limit\n                ):'''
          if text.count(old) != 1:
              raise SystemExit(f'beam_search replacement count={text.count(old)}')
          path.write_text(text.replace(old, new))

          test_path = Path('tests/decision/test_oracle_missing_branch_result.py')
          test = test_path.read_text()
          marker = '''class OracleMissingBranchResultTest(unittest.IsolatedAsyncioTestCase):\n'''
          client = '''\n\nclass _AllMissingBranchResultClient(_PartialBranchResultClient):\n    async def emulate_actions(\n        self,\n        instance_id: str,\n        items: list[dict],\n        *,\n        timeout_s: float,\n        simulation_options: dict | None = None,\n    ) -> dict:\n        del instance_id, items, timeout_s, simulation_options\n        return {"branch_results": {}}\n\n\n'''
          if test.count(marker) != 1:
              raise SystemExit(f'test class marker count={test.count(marker)}')
          test = test.replace(marker, client + marker)

          insert_before = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          method = '''\n    async def test_all_admitted_results_missing_fails_fast(self) -> None:\n        collector = BudgetedOracleCollector(\n            _AllMissingBranchResultClient(),\n            policy=PriorHeuristicPolicy(),\n            value_fn=HeuristicValueFunction(),\n            config=OracleCollectionConfig(\n                beam_config=BeamSearchConfig(\n                    beam_width=2,\n                    top_k_actions=2,\n                    max_depth=1,\n                    release_branches_on_finish=False,\n                ),\n                target_beam_width=2,\n                exhaustive_root_actions=True,\n            ),\n        )\n        root_decision = {\n            "decision_point_id": "d-root",\n            "masked_emulator_dto": {\n                "hp": 40,\n                "maxHp": 50,\n                "enemies": [{"hp": 10, "maxHp": 10, "isAlive": True, "intent": {}}],\n                "legal_actions": _ACTIONS,\n            },\n        }\n\n        with self.assertRaisesRegex(RuntimeError, "all emulate_actions branch results faulted"):\n            await collector.collect("inst-all-missing", root_decision, timeout_s=1.0)\n'''
          if test.count(insert_before) != 1:
              raise SystemExit(f'test footer marker count={test.count(insert_before)}')
          test_path.write_text(test.replace(insert_before, method + insert_before))
          PY
      - name: Run focused tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/decision/test_oracle_missing_branch_result.py tests/decision/test_beam_search.py
      - name: Commit final changes and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-fix-all-missing-branch-results.yml
          git add src/sts2_training/decision/beam_search.py tests/decision/test_oracle_missing_branch_result.py
          git commit -m 'Fail fast when all admitted branch results are missing'
          git push origin HEAD:track-beam-search-branch-faults
