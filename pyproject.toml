[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-training"
version = "0.1.0"
description = "Training-side client for the STS2_RL API v0.5"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires STS2_RL_ROOT and the real Emulator runtime",
  "emulator: verifies CoreCLR/Sts2Emulator.dll loading and a real Emulator step",
]
